---
deployment:
  tasks:
    - echo "Deploying HRMS Web App..."
    - mkdir -p tmp log
    - chmod 755 .
    - find . -type f -exec chmod 644 {} \;
    - find . -type d -exec chmod 755 {} \;
    - pip install --upgrade pip 2>/dev/null || echo "pip upgrade skipped"
    - pip install -r requirements.txt 2>/dev/null || pip install -r requirements-minimal.txt 2>/dev/null || echo "pip install skipped - run manually"
    - touch tmp/restart.txt
    - echo "Deployment completed."
