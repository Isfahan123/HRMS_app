<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ app_description }}">
    <meta name="version" content="{{ app_version }}">
    <link rel="stylesheet" href="/static/css/style.css?v={{ app_version }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>{{ app_name }} Login</h1>
            <p class="subtitle">{{ app_description }}</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Enter your username" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Enter your password" autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-primary">Login</button>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="loadingMessage" class="loading-message" style="display: none;">
                    Logging in...
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // Make Python config available to JavaScript
        window.APP_CONFIG = {
            name: "{{ app_name }}",
            version: "{{ app_version }}",
            environment: "{{ environment }}",
            apiPrefix: "{{ api_prefix }}",
            debug: {{ debug|lower }}
        };
    </script>
    <script src="/static/js/ux-utils.js?v={{ app_version }}"></script>
    <script src="/static/js/login.js?v={{ app_version }}"></script>
    {% if debug %}
    <div style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 12px;">
        v{{ app_version }} ({{ environment }})
    </div>
    {% endif %}
</body>
</html>
