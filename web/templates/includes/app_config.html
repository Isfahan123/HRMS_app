<!-- 
    Reusable template include for JavaScript APP_CONFIG 
    This makes Python configuration available to JavaScript
-->
<script>
    // Make Python config available to JavaScript
    window.APP_CONFIG = {
        name: "{{ app_name }}",
        version: "{{ app_version }}",
        environment: "{{ environment }}",
        apiPrefix: "{{ api_prefix }}",
        debug: {{ debug|lower if debug is defined else 'false' }},
        features: {
            calendar: {{ features.calendar|lower }},
            bonus: {{ features.bonus|lower }},
            payroll: {{ features.payroll|lower }},
            engagements: {{ features.engagements|lower }}
        }
    };
</script>
{% if is_development %}
<!-- Debug mode indicator (only visible in development environment) -->
<div style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 10000;">
    v{{ app_version }} ({{ environment }})
</div>
{% endif %}
